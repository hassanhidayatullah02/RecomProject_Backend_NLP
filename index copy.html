<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Games Recommendation</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9KSQwCE-ZratvGe_8RbOlG7DGcq9T6CcXsCo1yVlWTNlotnDVAOmkNG8&s=10");
            color: var(--text-main);
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .loading {
            display: none;
            text-align: center;
            color: var(--accent);
            margin: 20px 0;
            font-style: italic;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border-bottom: 4px solid var(--accent);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.4s forwards;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: var(--text-main);
            font-size: 1.1rem;
            text-align: center;
        }
        /* CSS Baru untuk membatasi teks deskripsi agar kartu tetap sejajar dan rapi */
        .card p.desc {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4; /* Maksimal 4 baris teks */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mesin Rekomendasi Game Steam</h1>
    <p class="subtitle">Berbasis Content-Based Filtering (Kemiripan Deskripsi)</p>

    <div class="search-box">
        <input type="text" id="gameInput" placeholder="Masukkan Nama Game (contoh: left 4 dead)" autocomplete="off">
        <button onclick="getRecommendations()">Cari Rekomendasi</button>
    </div>

    <div class="loading" id="loadingIndicator">Mencari game yang mirip...</div>

    <div class="results-grid" id="resultsContainer"></div>
</div>

<script>
    async function getRecommendations() {
        const inputVal = document.getElementById('gameInput').value.trim();
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');

        if (!inputVal) return;

        resultsContainer.innerHTML = '';
        loadingIndicator.style.display = 'block';

        try {
            const response = await fetch(`http://localhost:5000/recommend?game=${encodeURIComponent(inputVal)}`);
            
            if (!response.ok) {
                throw new Error(`Game yang mengandung "${inputVal}" tidak ditemukan.`);
            }

            const data = await response.json();
            loadingIndicator.style.display = 'none';

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.1}s`; 
                
                // Menambahkan <p class="desc"> untuk menampilkan item.short_description
                card.innerHTML = `
                    <img src="${item.header_image}" alt="Cover ${item.name}" onerror="this.src='https://via.placeholder.com/460x215?text=No+Image'">
                    <h3>${item.name}</h3>
                    <p class="desc" title="${item.short_description}">${item.short_description}</p>
                `;
                resultsContainer.appendChild(card);
            });

        } catch (error) {
            loadingIndicator.style.display = 'none';
            resultsContainer.innerHTML = `
                <div style="color: #ef4444; grid-column: 1 / -1; text-align: center; background: #450a0a; padding: 15px; border-radius: 8px;">
                    ${error.message} <br>
                    <small style="color: #fca5a5;">(Pastikan server Flask Python Anda sudah berjalan dan nama game diketik dengan benar)</small>
                </div>
            `;
        }
    }

    document.getElementById("gameInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            getRecommendations();
        }
    });
</script>

</body>
</html>
